AWSTemplateFormatVersion: '2010-09-09'
Description: Create a VPC with Public and Private Subnets, internet G/W & NACL
Parameters:
  VpcCIDR:
    Description: CIDR block for vpc
    Type: String
    Default: 10.0.30.40/24
  #SubnetId:
  #  Description: Id of subnet
  #  Type: String
  #  Default: ''
Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCIDR
      EnableDnsSupport: 'true'
      EnableDnsHostnames: 'true'

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.30.0/27
      MapPublicIpOnLaunch: 'false'
     # AvaliabilityZone: !Select [0, !GetAzs '']

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.30.64/27
     # AvaliabilityZone: !Select [1, !GetAzs '']

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.30.128/27
     # AvaliabilityZone: !Select [0, !GetAzs '']

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.30.192/27
     # AvaliabilityZone: !Select [1, !GetAzs '']

  PrivateSubnet3:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.30.224/27
     # AvaliabilityZone: !Select [0, !GetAzs '']

  InternetRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref InternetRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  AssociatePublicRouteTable:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
        SubnetId: !Ref PublicSubnet1
        RouteTableId: !Ref InternetRouteTable


  Nacl:
    Type: AWS::EC2::NetworkAcl
    Properties:
      VpcId: !Ref VPC

  NaclInboundRuleSSH:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref Nacl
      RuleNumber: 100
      Protocol: 6
      RuleAction: allow
      Egress: 'false'
      CidrBlock: 0.0.0.0/0
      PortRange:
        #IpProtocol: tcp
        From: 22
        To: 22
        From: 8080
        To: 8080

  #KeyPair:
  #  Type: AWS::EC2::KeyPair
  #  Properties:
  #    KeyName: ec2

  #ExistingKeyPairName:
  #  Type: String
  #  Description: ec2

  EC2NetworkInterface:
    Type: AWS::EC2::NetworkInterface
    Properties:
      Description: NI for ec2instance
      SubnetId: !Ref PublicSubnet1
      GroupSet: 
        - !Ref APPSecurityGroup

  MyInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: EC2SSMRole
      Roles:
        - !Ref MyIAMRole

  MyIAMRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: EC2SSMRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: EC2SSMpolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'ssm:StartSession'
                  - 'ssm:UpdateInformation'
                  - 'ssm:ListCommands'
                  - 'ssm:ListCommandInvocations'
                  - 'ssm:CreateDocument'
                  - 'ssm:DescribeAssociation'
                  - 'ssm:GetDeployablePatchSnapshotForInstance'
                  - 'ssm:GetDocument'
                  - 'ssm:DescribeDocument'
                  - 'ssm:GetManifest'
                  - 'ssm:GetParameters'
                  - 'ssm:ListAssociations'
                  - 'ssm:ListInstanceAssociations'
                  - 'ssm:PutInventory'
                  - 'ssm:PutComplianceItems'
                  - 'ssm:PutConfigurePackageResult'
                  - 'ssm:UpdateAssociationStatus'
                  - 'ssm:UpdateInstanceAssociationStatus'
                  - 'ssm:UpdateInstanceInformation'
                  - 'ssm:DescribeAssociation'
                  - 'ssm:GetDeployablePatchSnapshotForInstance'
                  - 'ssm:GetDocument'
                  - 'ssm:DescribeDocument'
                  - 'ssm:GetManifest'
                  - 'ssm:GetParameter'
                  - 'ssm:GetParameters'
                  - 'ssm:ListAssociations'
                  - 'ssm:ListInstanceAssociations'
                  - 'ssm:PutInventory'
                  - 'ssm:PutComplianceItems'
                  - 'ssm:PutConfigurePackageResult'
                  - 'ssm:UpdateAssociationStatus'
                  - 'ssm:UpdateInstanceAssociationStatus'
                  - 'ssm:UpdateInstanceInformation'
                Resource: '*'

  MyElasticIP:
    Type: AWS::EC2::EIP

  MyS3Bucket:
    Type: 'AWS::S3::Bucket'
    Properties:
      BucketName: ec2-creates

  #MyStackDependsOnNetworkInterface:
  #  Type: AWS::CloudFormation::WaitconditionHandle

  #MyStack:
  #  Type: AWS::CloudFormation::Stack
  #  DependsOn: MyStackDependsOnNetworkInterface
  #  Properties:
  #    TemplateURL: !Ref MyS3Bucket

  APPSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: SG for server
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

  EC2Instance:
    Type: AWS::EC2::Instance
    Properties: 
      InstanceType: t2.micro
      KeyName: ec2
      ImageId: ami-078c1149d8ad719a7
      IamInstanceProfile: EC2SSMRole
      #SubnetId: !Ref PublicSubnet1
      #SecurityGroupIds:
      #  - !Ref DBSecurityGroup
      NetworkInterfaces:
        - AssociatePublicIpAddress: 'true'
        #- NetworkInterfaceId: !Ref EC2NetworkInterface
          DeviceIndex: '0'
          SubnetId: !Ref PublicSubnet1
          #AssociatePublicIpAddress: 'true'
          GroupSet:
            - !Ref DBSecurityGroup
      
      #MyEIPAssociation:
      #  Type: AWS::EC2::EIPAssociation
      #  Properties:
      #    InstanceId: !Ref EC2Instance
      #    EIP: !GetAtt MyElasticIP.PublicIp

      UserData:
        Fn::Base64: !Sub |
          #!/Bin/Bash
          sudo apt update
          sudo apt install php
          sudo apt update && sudo apt upgrade
          sudo apt install software-properties-common
          sudo add-apt-repository ppa:ondrej/php
          sudo apt update
          sudo apt install php7.4-fpm -y
          sudo apt -y install libapache2-mod-php7.4
          php -v
          sudo systemctl restart nginx
          echo 'server {' >> /etc/nginx/sites-available/default
          echo '  # . . . existing configuration' >> /etc/nginx/sites-available/default
          echo '  location ~ \.php$ {' >> /etc/nginx/sites-available/default
          echo '    include snippets/fastcgi-php.conf;' >> /etc/nginx/sites-available/default
          echo '    fastcgi_pass unix:/run/php/php<version>-fpm.sock;' >> /etc/nginx/sites-available/default
          echo '  }' >> /etc/nginx/sites-available/default
          echo '}' >> /etc/nginx/sites-available/default
          sudo systemctl restart nginx
          sudo systemctl reload php<version_number>-fpm
          sudo apt install php7.4-{mysql,zip,bcmath}
          php -m
          
          
  DBNetworkInterface:
    Type: AWS::EC2::NetworkInterface
    Properties:
      Description: NI for ec2instance
      SubnetId: !Ref PublicSubnet2
      GroupSet: 
        - !Ref DBSecurityGroup

  DBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: SG for server
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp  
          FromPort: 27017
          ToPort: 27017
          CidrIp: 0.0.0.0/0

  DBServer:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t2.micro
      KeyName: ec2 
      ImageId: ami-078c1149d8ad719a7
      IamInstanceProfile: EC2SSMRole
      #SubnetId: !Ref PublicSubnet2
      #SecurityGroupIds:
      #  - !Ref DBSecurityGroup 
      NetworkInterfaces:
        - AssociatePublicIpAddress: 'true'
        #- NetworkInterfaceId: !Ref DBNetworkInterface
          DeviceIndex: '0'
          SubnetId: !Ref PublicSubnet1
          GroupSet:
            - !Ref DBSecurityGroup
          #AssociatePublicIpAddress: 'true'
      UserData:
        Fn::Base64: !Sub |
            #!/Bin/Bash
            sudo apt-get update
            sudo apt-get install -y mongodb   

Outputs:
  VpcId: 
    Description: VPC ID
    Value: !Ref VPC
  PublicSubnet1Id:
    Description: Public Subnet 1 ID
    Value: !Ref PublicSubnet1
  PublicSubnet2Id:
    Description: Public Subnet 2 ID
    Value: !Ref PublicSubnet2
  PrivateSubnet1Id:
    Description: Private Subnet 1 ID
    Value: !Ref PrivateSubnet1
  PrivateSubnet2Id:
    Description: Private Subnet 2 ID
    Value: !Ref PrivateSubnet2
  PrivateSubnet3Id:
    Description: Private Subnet 3 ID
    Value: !Ref PrivateSubnet3
  InternetGatewayId:
    Description: Internet Gateway Id
    Value: !Ref InternetGateway
  InstanceId:
    Description: EC2 Instance ID
    Value: !Ref EC2Instance
  MongoDBConnection:
    Description: Connection details for MongoDB
    Value: !Sub mongodb://${DBServer.PrivateDnsName}:27017/
  TomcatURL:
    Description: URL of the Apache Tomcat Server
    Value: !Sub http://${EC2Instance.PublicDnsName}:8080
  ElasticIPAddress:
    Description: the allocated elastic ip address
    Value: !GetAtt MyElasticIP.PublicIp
  S3BucketName:
    Description: ec2-creates
    Value: !Ref MyS3Bucket